name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test alert policy
        run: python3 scripts/test.py
      - name: Build universal app
        run: python3 scripts/build.py
      - name: Package and verify DMG
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: Battery-Alert-macOS
          path: dist/*
          if-no-files-found: error
